    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Simulation : éléments activés / exécutés */
        .sim-enabled .djs-visual > :first-child { stroke: #10b981 !important; stroke-width: 3px !important; }
        .sim-fired .djs-visual > :first-child { fill: #fde68a !important; stroke: #f59e0b !important; stroke-width: 4px !important; transition: fill .2s; }
        .sim-failed .djs-visual > :first-child { fill: #fecaca !important; stroke: #dc2626 !important; stroke-width: 4px !important; }

        .djs-palette {
            top: 20px !important;
            left: 20px !important;
            border-radius: 8px !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06) !important;
            border: 1px solid #e2e8f0 !important;
        }
    </style>
